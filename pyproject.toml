[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pob-cli"
version = "0.1.0"
description = "Path of Building Community Fork 的繁體中文命令列分析器"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pob = "pob_cli.cli:main"

[tool.setuptools.packages.find]
include = ["pob_cli*"]

[tool.setuptools.package-data]
pob_cli = ["tree.lua", "locales/*.json"]
